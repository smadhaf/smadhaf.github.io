    <!-- Confetti Canvas -->
<canvas id="confetti-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>

<script>
// Animasi teks berkilau
const style = document.createElement('style');
style.innerHTML = `
@keyframes glow {
  from { text-shadow: 0 0 10px #ff80bf, 0 0 20px #ff80bf, 0 0 30px #ff3399; }
  to { text-shadow: 0 0 20px #ff1a75, 0 0 30px #ff4da6, 0 0 40px #ff66b3; }
}`;
document.head.appendChild(style);

// Confetti sederhana
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const confetti = Array.from({length:150}, () => ({
  x: Math.random()*canvas.width,
  y: Math.random()*canvas.height,
  r: Math.random()*6+2,
  d: Math.random()*0.5 + 0.5
}));
function drawConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(255,182,193,0.8)';
  confetti.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2,true);
    ctx.fill();
  });
  updateConfetti();
}
function updateConfetti(){
  confetti.forEach(p => {
    p.y += p.d;
    if(p.y > canvas.height){
      p.y = 0;
      p.x = Math.random()*canvas.width;
    }
  });
}
setInterval(drawConfetti, 20);
</script>
